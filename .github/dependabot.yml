# Monthly dependency updates, minor and patch grouped into one pull request per ecosystem.
# Titles start with a Conventional Commits prefix, so the `PR title` check passes (docs/decisions/0008).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /api
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "ci(deps)"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
