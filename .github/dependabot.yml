# Monthly dependency updates, minor and patch grouped into one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
