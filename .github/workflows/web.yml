name: Web

on:
  pull_request:
    paths:
      - "web/**"
      - "api/docs/contracts/openapi.json"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/docs/contracts/openapi.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Generated API client matches the backend contract
        run: npm run contracts:check

      - name: Folder and boundary rules
        run: npm run architecture:structure

      - name: Code style
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          # The API origin is public (it ends up in the JS), so it is a repository variable, not a secret.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://vitaliy-home-api-ase3bfeab4e9gren.polandcentral-01.azurewebsites.net' }}
          # The Google OAuth client id of the sign-in button is public too (it is in every page); without it the
          # sign-in screen says sign-in is not set up. Read from a repository variable, or a secret of the same
          # name if it was saved there instead.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          IS_DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          # A deploy without the client id would lock the family out («Вхід ще не налаштовано»), so it stops here.
          if [ "$IS_DEPLOY" = "true" ] && [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::VITE_GOOGLE_CLIENT_ID is empty: add it under Settings > Secrets and variables > Actions > Variables (docs/deploy.md#sign-in-with-google)."
            exit 1
          fi
          npm run build
          if [ -n "$VITE_GOOGLE_CLIENT_ID" ] && ! grep -rqF "$VITE_GOOGLE_CLIENT_ID" dist/assets; then
            echo "::error::The built JS does not contain the Google client id."
            exit 1
          fi

      # Uploads the ready dist/ as is; the Static Web App does not build anything itself.
      - name: Deploy to Azure Static Web Apps
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true

      # The site must offer the Google button, not «Вхід ще не налаштовано»: the deployed bundle carries the client id.
      - name: Smoke test sign-in on the deployed site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ambitious-beach-0b1d13b10.6.azurestaticapps.net' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          expected=$(ls dist/assets/index-*.js | xargs -n1 basename)
          # The CDN takes a little while to serve a new deploy everywhere: the page and its JS may land apart.
          for attempt in $(seq 1 12); do
            html=$(curl -fsS "$SITE_URL/" || true)
            js=$(curl -fsS "$SITE_URL/assets/$expected" || true)
            if echo "$html" | grep -qF "$expected" && [ -n "$js" ]; then break; fi
            echo "The site does not serve $expected yet (attempt $attempt)"; sleep 10
          done
          echo "$html" | grep -qF "$expected" && [ -n "$js" ] \
            || { echo "::error::The site does not serve the new build $expected"; exit 1; }
          echo "$js" | grep -qF "$VITE_GOOGLE_CLIENT_ID" \
            || { echo "::error::The deployed JS has no Google client id: sign-in would say «Вхід ще не налаштовано»"; exit 1; }
          echo "The deployed site offers Google sign-in."

      # The installed app needs its service worker and manifest (web ADR 0021): a missing file would be answered with
      # index.html by the SPA fallback and break the update, so both must be the real files.
      - name: Smoke test the service worker and the manifest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ambitious-beach-0b1d13b10.6.azurestaticapps.net' }}
        run: |
          sw=$(curl -fsS "$SITE_URL/service-worker.js") || { echo "::error::/service-worker.js is not served"; exit 1; }
          echo "$sw" | grep -qF "index.html" && ! echo "$sw" | grep -qi "<!doctype html" \
            || { echo "::error::/service-worker.js is not the built service worker"; exit 1; }
          headers=$(curl -fsSI "$SITE_URL/service-worker.js")
          echo "$headers" | grep -qi "cache-control: no-cache" \
            || { echo "::error::/service-worker.js must be served with Cache-Control: no-cache"; exit 1; }
          manifest=$(curl -fsS "$SITE_URL/site.webmanifest") || { echo "::error::/site.webmanifest is not served"; exit 1; }
          echo "$manifest" | grep -qF '"display": "standalone"' \
            || { echo "::error::/site.webmanifest is not the app manifest"; exit 1; }
          echo "The service worker and the manifest are served."
