name: API

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: vitaliy-home-api
  APP_URL: https://vitaliy-home-api-ase3bfeab4e9gren.polandcentral-01.azurewebsites.net

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json

      - name: Restore
        run: dotnet restore HomeApp.slnx

      - name: Build (also regenerates the OpenAPI document)
        run: dotnet build HomeApp.slnx --no-restore --configuration Release

      - name: OpenAPI document matches the code
        run: git diff --exit-code -- docs/contracts/openapi.json

      - name: Unit tests
        run: dotnet test tests/UnitTests --no-build --configuration Release

      - name: Architecture tests
        run: dotnet test tests/ArchitectureTests --no-build --configuration Release

      - name: Integration tests (PostgreSQL in Testcontainers)
        run: dotnet test tests/IntegrationTests --no-build --configuration Release

      - name: Publish
        if: github.event_name != 'pull_request'
        run: dotnet publish src/Host/Host.Api --no-build --configuration Release --output ${{ runner.temp }}/api

      - name: Build the migration bundles (one per module)
        if: github.event_name != 'pull_request'
        run: |
          dotnet tool restore
          dotnet ef migrations bundle --configuration Release --self-contained --target-runtime linux-x64 \
            --project src/Modules/Expenses/Expenses.Infrastructure --startup-project src/Host/Host.Api \
            --context ExpensesDbContext --output ${{ runner.temp }}/migrations/expenses
          dotnet ef migrations bundle --configuration Release --self-contained --target-runtime linux-x64 \
            --project src/Modules/Shopping/Shopping.Infrastructure --startup-project src/Host/Host.Api \
            --context ShoppingDbContext --output ${{ runner.temp }}/migrations/shopping
          dotnet ef migrations bundle --configuration Release --self-contained --target-runtime linux-x64 \
            --project src/Modules/Gifts/Gifts.Infrastructure --startup-project src/Host/Host.Api \
            --context GiftsDbContext --output ${{ runner.temp }}/migrations/gifts

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: api
          path: ${{ runner.temp }}/api
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: migrations
          path: ${{ runner.temp }}/migrations
          retention-days: 3

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.APP_URL }}/health
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure, no stored password
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: api

      - uses: actions/download-artifact@v4
        with:
          name: migrations
          path: migrations

      # Migrations run before the new version starts and keep the previous release working (add first, remove later).
      - name: Apply database migrations
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: |
          if [ -z "$DATABASE_CONNECTION_STRING" ]; then
            echo "::error::Secret DATABASE_CONNECTION_STRING is not set in the production environment (see docs/deploy.md)."
            exit 1
          fi
          for bundle in migrations/*; do
            chmod +x "$bundle"
            echo "Migrating $(basename "$bundle")"
            # The bundle starts the host to build the DbContext, and the host requires ConnectionStrings:Database.
            ConnectionStrings__Database="$DATABASE_CONNECTION_STRING" "$bundle" --connection "$DATABASE_CONNECTION_STRING"
          done

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: api
          startup-command: dotnet Host.Api.dll

      - name: Smoke test /health
        run: |
          # F1 has no Always On, so the first request after a deploy wakes the app up. The old build can still
          # answer for a while after the deploy, so only a healthy answer whose version carries this commit counts.
          for attempt in $(seq 1 18); do
            body=$(curl --fail --silent --show-error --max-time 30 "$APP_URL/health" || true)
            echo "$body"
            if echo "$body" | grep -q "$GITHUB_SHA" && echo "$body" | grep -q '"status":"Healthy"'; then exit 0; fi
            echo "Attempt $attempt: not the new healthy build yet, retrying in 10s"
            sleep 10
          done
          exit 1
