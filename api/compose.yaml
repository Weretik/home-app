# Local PostgreSQL for development. Start it with `docker compose up -d` from this folder.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: home
    ports:
      - "5432:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  database-data:
